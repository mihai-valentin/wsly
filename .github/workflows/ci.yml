name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-helper:
    name: Bash helper contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test interactive-shell helper behavior
        run: bash tests/test-wsly-bash.sh

  powershell-parse:
    name: PowerShell parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "${{ github.workspace }}\wsly.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
