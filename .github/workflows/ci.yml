name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-helper:
    name: Bash helper contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test interactive-shell helper behavior
        run: bash tests/test-wsly-bash.sh

  powershell-parse:
    name: PowerShell parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          @('wsly.ps1', 'wsly-completion.ps1', 'install.ps1', 'uninstall.ps1') | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path '${{ github.workspace }}' $_),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Test PowerShell launcher behavior
        shell: pwsh
        run: ./tests/test-wsly.ps1
