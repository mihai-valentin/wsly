name: Bug report
description: Report unexpected wsly behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security reports. See SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include the PowerShell command and redacted output.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows version, PowerShell version, `wsl --version`, and distro.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and redacted sensitive information.
          required: true
